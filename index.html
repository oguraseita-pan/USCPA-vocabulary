<script>
(()=>{'use strict';
const payload=JSON.parse(document.getElementById('app-data').textContent);
const words=payload.words.map(x=>({id:x[0],en:x[1],ja:x[2],aliases:x[3],groups:x[4]}));
const wordMap=new Map(words.map(w=>[w.id,w]));
const STORE='lexi_uscpa_state_v1';
const DEFAULTS={retention:90,scale:1,again:1,hard:10,newLimit:20,maxDays:365,autoplay:false,voiceRate:.88};
let storageReady=true,stored={};try{stored=JSON.parse(localStorage.getItem(STORE)||'{}');}catch(e){storageReady=false;stored={};}
let db={cards:stored.cards&&typeof stored.cards==='object'?stored.cards:{},history:Array.isArray(stored.history)?stored.history:[],prefs:{...DEFAULTS,...(stored.prefs||{})}};
let filters={source:'far',chapter:'all',mode:'priority',direction:'en-ja',favorites:false,...(stored.filters||{})};
let view='study',current=null,revealed=false,showCount=40,libraryQuery='',libraryStatus='all',postponed=new Set(),studyCount=0,tabState={},toastTimeout=null;
const el=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const h=(s)=>esc(s).replace(/\n/g,' ');
function save(){if(!storageReady)return;try{localStorage.setItem(STORE,JSON.stringify({...db,filters}));}catch(e){storageReady=false;toast('保存できません。設定からバックアップしてください。');}}
const today=(dt=new Date())=>`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
function relTime(ms){if(!Number.isFinite(ms))return '—';let v=Math.max(0,ms);if(v<3e6)return Math.max(1,Math.round(v/60000))+'分';if(v<3.6e6*22)return Math.max(1,Math.round(v/3.6e6))+'時間';const d=Math.max(1,Math.round(v/864e5));return d<30?d+'日':d<365?Math.round(d/7)+'週':(d/365).toFixed(1)+'年';}
const getCard=id=>db.cards[id]||{};
function isNew(w){return !(getCard(w.id).reps>0)}
function isDue(w){let c=getCard(w.id);return c.reps>0 && (c.due||0)<=Date.now()}
function eligible(w){const c=getCard(w.id);return !c.skip && (!filters.favorites||c.fav)&&w.groups.some(g=>(filters.source==='both'||g[0]===filters.source)&&(filters.chapter==='all'||`${g[0]}:${g[1]}`===filters.chapter));}
function sourceOptions(){return [['far','FAR'],['intro','英文会計入門'],['both','両方']]}
function chapterOptions(){let a=[['all','すべての章']];for(const s of (filters.source==='both'?['far','intro']:[filters.source]))for(const [n,name] of payload.chapters[s])a.push([`${s}:${n}`,`${s==='far'?'FAR':'入門'} 第${n}章｜${name}`]);return a;}
function optHtml(arr,v){return arr.map(([k,label])=>`<option value="${h(k)}"${String(k)===String(v)?' selected':''}>${h(label)}</option>`).join('')}
function filterCards(){return words.filter(eligible)}
function todayEvents(){return db.history.filter(e=>e.day===today())}
function newToday(){return todayEvents().filter(x=>x.wasNew).length}
function dashboard(pool){const now=Date.now();const due=pool.filter(w=>{let c=getCard(w.id);return c.reps>0&&c.due<=now}).length;const nw=pool.filter(isNew).length;const reviewed=pool.filter(w=>getCard(w.id).reps>0).length;return {due,nw,reviewed,total:pool.length,done:todayEvents().length}}
function validCurrent(){return current&&wordMap.has(current)&&eligible(wordMap.get(current))}
function chooseCard(force=false){if(validCurrent()&&!force)return wordMap.get(current);const pool=filterCards();let due=pool.filter(w=>isDue(w)&&!postponed.has(w.id));let fresh=pool.filter(w=>isNew(w)&&!postponed.has(w.id));if(newToday()>=db.prefs.newLimit)fresh=[];let candidates;
 if(filters.mode==='random'){candidates=due.concat(fresh);}
 else{due.sort((a,b)=>(getCard(a.id).due||0)-(getCard(b.id).due||0));candidates=due.length?due:fresh;}
 if(!candidates.length){current=null;revealed=false;return null;}
 const chosen=filters.mode==='random'||(!due.length)?candidates[Math.floor(Math.random()*candidates.length)]:candidates[0];current=chosen.id;revealed=false;autoSpeak(chosen);return chosen;
}
function targetFactor(){return Math.log(Math.max(.7,Math.min(.99,db.prefs.retention/100)))/Math.log(.9)*db.prefs.scale}
function predicted(card,rating,now=Date.now()){
 const st=Number(card.stability)||0, n=Number(card.reps)||0, p=db.prefs;
 let stability,interval;
 if(rating===1){stability=n?Math.max(.2,st*.38):.2;interval=p.again/1440;}
 if(rating===2){stability=n?Math.max(.6,st*1.15):.6;interval=n?Math.max(p.hard/1440,stability*targetFactor()*.62):p.hard/1440;}
 if(rating===3){stability=n?Math.max(1,st*(1.85+(card.lastRating===1?.25:0))):1;interval=stability*targetFactor();}
 if(rating===4){stability=n?Math.max(3.5,st*2.6):3.5;interval=stability*targetFactor()*1.12;}
 const days=Math.min(p.maxDays,Math.max(1/1440,interval));return {stability,interval:days,due:now+days*864e5};
}
function grade(rating){if(!revealed||!current)return;const w=wordMap.get(current),old=getCard(current),wasNew=!(old.reps>0),n=Date.now(),p=predicted(old,rating,n);
 db.cards[current]={...old,reps:(old.reps||0)+1,stability:p.stability,interval:p.interval,due:p.due,last:n,lastRating:rating,lapses:(old.lapses||0)+(rating===1?1:0)};
 db.history.push({id:current,rating,day:today(),time:n,wasNew});if(db.history.length>30000)db.history=db.history.slice(-20000);
 studyCount++;current=null;revealed=false;save();render();}
function toast(msg){const t=el('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>t.classList.add('hidden'),2600)}
function speaker(w){if(!('speechSynthesis' in window)){toast('このブラウザでは音声が利用できません');return;}try{speechSynthesis.cancel();const s=new SpeechSynthesisUtterance(w.en);s.lang='en-US';s.rate=db.prefs.voiceRate||.88;s.pitch=1;const voices=speechSynthesis.getVoices();const v=voices.find(x=>x.lang==='en-US')||voices.find(x=>x.lang.startsWith('en'));if(v)s.voice=v;speechSynthesis.speak(s)}catch(e){toast('音声を再生できませんでした')}}
function autoSpeak(w){if(!db.prefs.autoplay||!w)return;setTimeout(()=>{if(view==='study'&&current===w.id)speaker(w)},100)}
const svg={study:'<path d="M12 20l-8-4V5l8 4 8-4v11l-8 4z"/><path d="M12 9v11M4 5l8-3 8 3"/>',list:'<path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/>',stats:'<path d="M4 20V10M10 20V4M16 20v-8M22 20v-13"/>',settings:'<path d="M4 7h16M4 17h16M9 4v6M15 14v6"/>',audio:'<path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/>',star:'<path d="m12 3 2.78 5.63L21 9.54l-4.5 4.39 1.06 6.2L12 17.2l-5.56 2.93 1.06-6.2L3 9.54l6.22-.91L12 3z"/>',ban:'<circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/>',next:'<path d="m5 12 14 0m-6-6 6 6-6 6"/>'};
const icon=(name)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${svg[name]}</svg>`;
const views=[['study','学習',icon('study')],['list','単語一覧',icon('list')],['stats','統計',icon('stats')],['settings','設定',icon('settings')]];
function renderNav(){for(let x of ['navdesktop','navmobile'])el(x).innerHTML=views.map(v=>`<button type="button" class="navlink ${view===v[0]?'active':''}" data-nav="${v[0]}">${v[2]}<span>${v[1]}</span></button>`).join('');}

function studyHeader(){const pool=filterCards(),s=dashboard(pool),rem=Math.max(0,db.prefs.newLimit-newToday());let within=s.due+Math.min(rem,s.nw);return `<div class="page-head studyHead"><h1 class="page-title">今日の学習 <span style="font-weight:400;color:#b0bebf;font-size:16px">/ Study</span></h1><p class="page-sub">少しずつ、確実に。今日も一歩ずつ積み重ねましょう。</p></div><div class="kpi-grid"><div class="kpi"><span>復習する単語</span><strong>${s.due.toLocaleString()}</strong><small>語</small></div><div class="kpi"><span>新しい単語</span><strong>${s.nw.toLocaleString()}</strong><small>語</small></div><div class="kpi"><span>今日の回答</span><strong>${s.done.toLocaleString()}</strong><small>回</small></div></div>`;}
function controls(){return `<div class="controlsPanel"><div class="controlsRow"><div class="controlGroup"><label class="fieldLabel" for="source">教材を選ぶ</label><select class="select" id="source" data-filter="source">${optHtml(sourceOptions(),filters.source)}</select></div><div class="controlGroup big"><label class="fieldLabel" for="chapter">学習する章</label><select class="select" id="chapter" data-filter="chapter">${optHtml(chapterOptions(),filters.chapter)}</select></div><div class="controlGroup desktopDirection"><label class="fieldLabel" for="direction">カードの向き</label><select class="select" id="direction" data-filter="direction">${optHtml([['en-ja','英語 → 日本語'],['ja-en','日本語 → 英語']],filters.direction)}</select></div></div><div class="studyOpts"><div class="modeSet"><button class="modeButton ${filters.mode==='priority'?'active':''}" data-mode="priority">復習優先</button><button class="modeButton ${filters.mode==='random'?'active':''}" data-mode="random">ランダム</button></div><select class="select mobileDirection" aria-label="カードの向き" data-filter="direction">${optHtml([['en-ja','英→日'],['ja-en','日→英']],filters.direction)}</select><label class="quietSwitch"><input type="checkbox" id="favOnly" ${filters.favorites?'checked':''}>お気に入りのみ</label></div></div>`;}
function renderStudy(){const pool=filterCards(),stat=dashboard(pool),w=chooseCard();let body=studyHeader()+controls();const left=Math.max(0,db.prefs.newLimit-newToday());
 if(w){const c=getCard(w.id),front=filters.direction==='en-ja'?w.en:w.ja,back=filters.direction==='en-ja'?w.ja:w.en;
 const g=w.groups.find(x=>(filters.source==='both'||x[0]===filters.source)&&(filters.chapter==='all'||`${x[0]}:${x[1]}`===filters.chapter))||w.groups[0];

 }else{

 }

}
function statuses(){return [['all','すべて'],['fresh','未学習'],['due','復習待ち'],['fav','お気に入り'],['skip','学習除外']]}
function libraryMatch(w){const inSource=w.groups.some(g=>(filters.source==='both'||g[0]===filters.source)&&(filters.chapter==='all'||`${g[0]}:${g[1]}`===filters.chapter));if(!inSource)return false;let c=getCard(w.id);if(libraryStatus==='fresh'&&!isNew(w))return false;if(libraryStatus==='due'&&!isDue(w))return false;if(libraryStatus==='fav'&&!c.fav)return false;if(libraryStatus==='skip'&&!c.skip)return false;const q=libraryQuery.toLocaleLowerCase().trim();return !q||w.en.toLocaleLowerCase().includes(q)||w.ja.toLocaleLowerCase().includes(q)||w.aliases.some(x=>x.toLocaleLowerCase().includes(q));}
function renderList(){el('main').innerHTML=`<div class="page-head"><h1 class="page-title">単語一覧 <span style="font-weight:400;color:#b0bebf;font-size:16px">/ Library</span></h1><p class="page-sub">2,508語から検索・お気に入り登録・学習除外ができます。</p></div><div class="panel"><div class="controlsRow" style="margin-bottom:14px"><div class="controlGroup"><label class="fieldLabel">教材</label><select class="select" data-filter="source">${optHtml(sourceOptions(),filters.source)}</select></div><div class="controlGroup big"><label class="fieldLabel">章</label><select class="select" data-filter="chapter">${optHtml(chapterOptions(),filters.chapter)}</select></div></div><div class="listToolbar"><input class="searchInput" type="text" id="searchWord" placeholder="英語・日本語で検索" value="${h(libraryQuery)}" autocomplete="off"><select class="select" id="libraryStatus">${optHtml(statuses(),libraryStatus)}</select></div><div class="panelHead" style="margin-bottom:3px"><h2>収録単語 <span class="muted" id="wordCount"></span></h2><span class="muted">タップして学習</span></div><div id="libraryResults" class="wordList"></div><button id="loadMore" class="softbutton loadMore hidden" data-action="more">もっと見る</button></div>`;renderLibraryResults()}
function renderLibraryResults(){const matched=words.filter(libraryMatch),shown=matched.slice(0,showCount),root=el('libraryResults');if(!root)return;el('wordCount').textContent=`${matched.length.toLocaleString()} 語`;
 root.innerHTML=shown.length?shown.map(w=>{const c=getCard(w.id),g=w.groups.find(x=>(filters.source==='both'||x[0]===filters.source)&&(filters.chapter==='all'||`${x[0]}:${x[1]}`===filters.chapter))||w.groups[0];return `<div class="wordRow"><div class="wordData" data-open-word="${w.id}" role="button" tabindex="0"><div class="wordTitle">${h(w.en)}</div><p class="wordTranslation">${h(w.ja)}</p><div class="wordDetails"><span class="miniTag">${g[0]==='far'?'FAR':'入門'} 第${g[1]}章</span>${c.skip?'<span class="miniTag gray">学習除外</span>':c.reps?`<span class="miniTag gray">${isDue(w)?'復習待ち':'学習済み'}</span>`:''}</div></div><button title="お気に入り" aria-label="お気に入り" class="tinyaction ${c.fav?'active':''}" data-fav-id="${w.id}">${c.fav?'★':'☆'}</button><button title="学習除外" aria-label="学習除外" class="tinyaction exclude ${c.skip?'active':''}" data-skip-id="${w.id}">${c.skip?'⊘':'⊖'}</button></div>`}).join(''):'<div class="empty" style="min-height:160px;padding:25px"><p>条件に合う単語はありません</p></div>';
 el('loadMore').classList.toggle('hidden',matched.length<=showCount);
}
function lastDays(n=7){const a=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);a.push({day:today(d),label:['日','月','火','水','木','金','土'][d.getDay()]})}return a}
function renderStats(){const total=words.length,learned=words.filter(w=>getCard(w.id).reps>0).length,due=words.filter(isDue).length,fav=words.filter(w=>getCard(w.id).fav).length,exclude=words.filter(w=>getCard(w.id).skip).length,days=lastDays(),counts=days.map(d=>db.history.filter(x=>x.day===d.day).length),mx=Math.max(1,...counts);let good=db.history.filter(x=>x.rating>=3).length,ratio=db.history.length?Math.round(good/db.history.length*100):0;
 let learnedBySource=[['FAR',words.filter(w=>w.groups.some(g=>g[0]==='far'&&g[1]>=1))],['英文会計入門',words.filter(w=>w.groups.some(g=>g[0]==='intro'))]];
 el('main').innerHTML=`<div class="page-head"><h1 class="page-title">学習の記録 <span style="font-weight:400;color:#b0bebf;font-size:16px">/ Progress</span></h1><p class="page-sub">積み重ねた復習回数と、単語の習得状況。</p></div><div class="statsCards" style="margin-bottom:15px"><div class="statsBig"><span>学習した単語</span><strong>${learned.toLocaleString()} <small style="color:#9baaae;font-size:13px">/ ${total.toLocaleString()}</small></strong></div><div class="statsBig"><span>総回答回数</span><strong>${db.history.length.toLocaleString()}</strong></div><div class="statsBig"><span>普通・簡単の割合</span><strong>${ratio}%</strong></div><div class="statsBig"><span>お気に入り / 除外</span><strong>${fav} <small style="color:#9baaae;font-size:13px">/ ${exclude}</small></strong></div></div><div class="panel"><div class="panelHead"><h2>直近7日間の学習</h2><span class="muted">回答回数</span></div><div class="weekbars">${days.map((d,i)=>`<div class="weekCol"><div class="weekBar" style="height:${Math.max(3,Math.round(counts[i]/mx*103))}px" title="${d.day}: ${counts[i]}回"></div><span>${d.label}</span></div>`).join('')}</div><p class="caption" style="margin-top:32px">過去7日間の合計 ${counts.reduce((a,b)=>a+b,0)} 回 ／ 現在の復習待ち ${due} 語</p></div><div class="panel"><h2>教材別の学習進捗</h2>${learnedBySource.map(([label,arr])=>{const n=arr.filter(w=>getCard(w.id).reps>0).length;return `<div class="statline"><label>${label}</label><div class="lineTrack"><div class="lineFill" style="width:${Math.round(n/arr.length*100)}%"></div></div><span class="val">${n}/${arr.length}</span></div>`}).join('')}</div>`;
}
function curveSvg(){const p=db.prefs,base=Math.max(.2,targetFactor()),vals=[];for(let i=0;i<=70;i++){const t=i/70*7;const r=Math.exp(Math.log(.9)*t/Math.max(.2,p.scale));vals.push([20+i/70*580,112-r*90]);}const points=vals.map(v=>v.join(',')).join(' ');const xret=20+Math.min(7,base)/7*580;return `<svg class="retentionplot" viewBox="0 0 625 142" role="img" aria-label="復習間隔と記憶保持率のイメージ"><path d="M20 7V112H600" fill="none" stroke="#dfe9e9" stroke-width="1.3"/><path d="M20 36H600M20 74H600" fill="none" stroke="#eef2f1" stroke-dasharray="3 6"/><polyline fill="none" stroke="#15927b" stroke-width="3.3" stroke-linecap="round" points="${points}"/><path d="M${xret} 19V112" stroke="#b5c6c4" stroke-dasharray="4 5"/><text x="20" y="132" fill="#9caeb4" font-size="10">0日</text><text x="580" y="132" fill="#9caeb4" font-size="10">7日</text><text x="${Math.min(560,xret+4)}" y="15" fill="#15846f" font-size="10">${p.retention}%</text></svg>`;}
function renderSettings(){let p=db.prefs;el('main').innerHTML=`<div class="page-head"><h1 class="page-title">学習設定 <span style="font-weight:400;color:#b0bebf;font-size:16px">/ Settings</span></h1><p class="page-sub">自分に合うペースに調整できます。変更は次回の評価から反映されます。</p></div><div class="panel"><div class="panelHead"><h2>忘却曲線と復習間隔</h2><span class="muted">カスタマイズ可能</span></div><div class="settingsGrid"><div class="settingsField"><label for="retention">目標記憶率 <span class="inlineValue" id="retentionNum">${p.retention}%</span></label><input id="retention" type="range" min="75" max="97" step="1" value="${p.retention}" data-pref="retention"><p class="help">高いほど短い間隔で復習します。おすすめ：90%</p></div><div class="settingsField"><label for="scale">復習間隔 <span class="inlineValue" id="scaleNum">×${p.scale.toFixed(2)}</span></label><input id="scale" type="range" min="0.5" max="2" step="0.05" value="${p.scale}" data-pref="scale"><p class="help">小さくすると復習を早め、大きくすると長くします。</p></div><div class="settingsField"><label for="again">「もう一度」の間隔（分）</label><input type="number" id="again" min="1" max="180" value="${p.again}" data-pref="again"><p class="help">思い出せなかった単語は短い間隔で再登場。</p></div><div class="settingsField"><label for="hard">「難しい」の初回間隔（分）</label><input type="number" id="hard" min="1" max="1440" value="${p.hard}" data-pref="hard"><p class="help">初めて学ぶ単語で「難しい」を選んだ場合。</p></div><div class="settingsField"><label for="newLimit">1日の新規単語数</label><input type="number" id="newLimit" min="1" max="500" value="${p.newLimit}" data-pref="newLimit"><p class="help">復習がある場合は、新規単語より優先されます。</p></div><div class="settingsField"><label for="maxDays">最大復習間隔（日）</label><input type="number" id="maxDays" min="1" max="3650" value="${p.maxDays}" data-pref="maxDays"><p class="help">復習間隔の上限。標準は365日です。</p></div></div><div class="chartWrap" id="curve">${curveSvg()}</div><p class="caption">初回に「普通」を選んだときのモデル上の記憶保持率イメージです。個人の実測値ではありません。</p><div class="settingsHelp">このアプリは、記憶保持率が時間とともに低下するモデルを参考にし、4段階の回答から次の復習時刻を調整する簡易SRSです。AnkiのFSRSと同じアルゴリズムではありません。設定変更前に予定された復習時刻は維持します。</div></div><div class="panel"><h2>音声とカード</h2><div class="settingsGrid" style="margin-top:20px"><div class="settingsField"><label for="voiceRate">英語の読み上げ速度 <span class="inlineValue" id="voiceRateNum">×${p.voiceRate.toFixed(2)}</span></label><input type="range" id="voiceRate" min="0.60" max="1.25" step="0.05" value="${p.voiceRate}" data-pref="voiceRate"><p class="help">単語カードの音声ボタンでいつでも再生できます。</p></div><div class="settingsField"><label style="display:flex;align-items:center;gap:9px;margin-top:8px"><input type="checkbox" id="autoplay" ${p.autoplay?'checked':''} data-pref="autoplay" style="accent-color:#168a75">新しいカードを自動読み上げ</label><p class="help">スマートフォンでは最初に音声ボタンを押す必要がある場合があります。</p></div></div></div><div class="panel"><h2>学習データのバックアップ</h2><p class="caption" style="margin-top:11px">進捗・お気に入り・除外・設定はこのブラウザに保存されます。PCとスマホは自動同期されないため、端末間で進捗を移す場合はバックアップを利用してください。</p><div class="settingsButtons"><button class="primaryOutline" data-action="export">バックアップを保存（JSON）</button><button class="primaryOutline" data-action="import">バックアップから復元</button><button class="dangerOutline" data-action="reset">学習履歴をリセット</button></div></div>`;}
function exportBackup(){const file={format:'lexi-uscpa',version:1,created:new Date().toISOString(),dataVersion:payload.updated,cards:db.cards,history:db.history,prefs:db.prefs,filters};const text=JSON.stringify(file);const blob=new Blob([text],{type:'application/json'}),url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`lexi-uscpa-backup-${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('バックアップを保存しました');}
async function importBackup(file){try{if(!file||file.size>20e6)throw Error('サイズが大きすぎます');const raw=JSON.parse(await file.text());if(raw.format!=='lexi-uscpa'||!raw.cards||!Array.isArray(raw.history))throw Error('形式が異なります');if(!confirm('現在の学習履歴をバックアップの内容で置き換えます。よろしいですか？'))return;const cleaned={};for(const [id,c]of Object.entries(raw.cards)){if(wordMap.has(id)&&c&&typeof c==='object')cleaned[id]=c;}db={cards:cleaned,history:raw.history.filter(e=>wordMap.has(e.id)).slice(-30000),prefs:{...DEFAULTS,...(raw.prefs||{})}};filters={...filters,...(raw.filters||{})};current=null;postponed.clear();save();render();toast('バックアップを復元しました');}catch(e){toast('読み込み失敗：'+e.message)}}
function updatePref(key,value){const range={retention:[75,97],scale:[.5,2],again:[1,180],hard:[1,1440],newLimit:[1,500],maxDays:[1,3650],voiceRate:[.6,1.25]};if(key==='autoplay'){db.prefs.autoplay=!!value;}else if(range[key]){const n=Number(value);if(!Number.isFinite(n))return;db.prefs[key]=Math.max(range[key][0],Math.min(range[key][1],n));}save();if(key==='retention'||key==='scale'){el('retentionNum').textContent=db.prefs.retention+'%';el('scaleNum').textContent='×'+db.prefs.scale.toFixed(2);el('curve').innerHTML=curveSvg()}if(key==='voiceRate')el('voiceRateNum').textContent='×'+db.prefs.voiceRate.toFixed(2)}
function toggleCardFlag(id,key){const v={...getCard(id)};v[key]=!v[key];db.cards[id]=v;save();if(view==='study'&&key==='skip'&&v.skip){current=null;render();toast('学習対象から除外しました')}else if(view==='study')render();else if(view==='list')renderLibraryResults()}
function route(to){view=to;showCount=40;current=null;revealed=false;postponed.clear();studyCount=0;window.location.hash=to==='study'?'study':to;render();window.scrollTo({top:0,behavior:'instant'});}
function onAction(a){if(a==='reveal'){revealed=true;renderStudy();if(window.innerWidth<=800)setTimeout(()=>el('answerArea')?.scrollIntoView({block:'center',behavior:'smooth'}),40);return}if(a==='speak'&&current){speaker(wordMap.get(current));return}if(a==='favorite'&&current){toggleCardFlag(current,'fav');return}if(a==='exclude'&&current){toggleCardFlag(current,'skip');return}if(a==='postpone'&&current){postponed.add(current);current=null;renderStudy();return}if(a==='more'){showCount+=40;renderLibraryResults();return}if(a==='export')return exportBackup();if(a==='import')return el('restoreFile').click();if(a==='reset'){if(confirm('回答履歴と単語の学習状態をすべて削除します。お気に入り・除外は残します。よろしいですか？')){for(const id in db.cards){const c=db.cards[id];db.cards[id]={fav:!!c.fav,skip:!!c.skip};}db.history=[];current=null;postponed.clear();save();render();toast('学習履歴をリセットしました')}}}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){route(nav.dataset.nav);return}const gr=e.target.closest('[data-grade]');if(gr){grade(Number(gr.dataset.grade));return}const fav=e.target.closest('[data-fav-id]');if(fav){toggleCardFlag(fav.dataset.favId,'fav');return}const skip=e.target.closest('[data-skip-id]');if(skip){toggleCardFlag(skip.dataset.skipId,'skip');return}const open=e.target.closest('[data-open-word]');if(open){const w=wordMap.get(open.dataset.openWord);if(w){view='study';filters.favorites=false;filters.source='both';filters.chapter='all';current=w.id;revealed=false;postponed.clear();save();render();window.scrollTo({top:0,behavior:'instant'});}return}const a=e.target.closest('[data-action]');if(a){onAction(a.dataset.action);return}});
document.addEventListener('change',e=>{const f=e.target.dataset.filter;if(f){filters[f]=e.target.value;if(f==='source')filters.chapter='all';current=null;revealed=false;postponed.clear();studyCount=0;save();render();return;}if(e.target.id==='favOnly'){filters.favorites=e.target.checked;current=null;postponed.clear();save();render();return}if(e.target.id==='libraryStatus'){libraryStatus=e.target.value;showCount=40;renderLibraryResults();return}const pref=e.target.dataset.pref;if(pref){updatePref(pref,e.target.type==='checkbox'?e.target.checked:e.target.value);if(e.target.type==='number')e.target.value=db.prefs[pref];}});
document.addEventListener('input',e=>{if(e.target.id==='searchWord'){libraryQuery=e.target.value;showCount=40;renderLibraryResults();return}if(e.target.dataset.pref&&e.target.type==='range')updatePref(e.target.dataset.pref,e.target.value)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(b){filters.mode=b.dataset.mode;current=null;postponed.clear();studyCount=0;save();render()}});
document.addEventListener('keydown',e=>{if((e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT'))return;if(e.target.hasAttribute('data-open-word')&&e.key==='Enter'){e.preventDefault();e.target.click();return}if(view!=='study')return;if(e.code==='Space'&&!e.repeat){e.preventDefault();if(!revealed&&current){revealed=true;renderStudy()}}if(revealed&&current&&'1234'.includes(e.key)&&e.key.length===1){e.preventDefault();grade(Number(e.key));}if((e.key==='f'||e.key==='F')&&current){toggleCardFlag(current,'fav')}if((e.key==='p'||e.key==='P')&&current)speaker(wordMap.get(current));});
el('restoreFile').addEventListener('change',e=>{const f=e.target.files?.[0];if(f)importBackup(f);e.target.value=''});
el('brandLink').addEventListener('click',e=>{e.preventDefault();route('study')});
if(!storageReady)setTimeout(()=>toast('ブラウザで保存が無効です。バックアップを利用してください。'),800);
const hash=window.location.hash.replace('#','');if(views.some(v=>v[0]===hash))view=hash;
render();
if('serviceWorker' in navigator&&window.location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body>
</html>
